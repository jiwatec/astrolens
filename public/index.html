<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Explore the cosmos — AstroLens features NASA's Picture of the Day plus curated galleries of constellations, galaxies, nebulae, planets, and stars." />
  <title>AstroLens</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- ═══ Animated star-field canvas ═══ -->
  <canvas id="starfield" aria-hidden="true"></canvas>

  <!-- ═══ Floating nebula blobs ═══ -->
  <div class="nebula nebula--1" aria-hidden="true"></div>
  <div class="nebula nebula--2" aria-hidden="true"></div>
  <div class="nebula nebula--3" aria-hidden="true"></div>

  <!-- ═══ Top Navigation Bar ═══ -->
  <nav id="top-nav" aria-label="Main navigation">
    <div class="nav__brand">
      <span class="nav__logo">AstroLens</span>
    </div>

    <div class="nav__center">
      <ul id="nav-tabs" class="nav__tabs">
        <li>
          <button class="nav__tab active" data-tab="random" type="button">Discovery</button>
        </li>
        <li>
          <button class="nav__tab" data-tab="constellations" type="button">Constellations</button>
        </li>
        <li>
          <button class="nav__tab" data-tab="galaxies" type="button">Galaxies</button>
        </li>
        <li>
          <button class="nav__tab" data-tab="nebulae" type="button">Nebulae</button>
        </li>
        <li>
          <button class="nav__tab" data-tab="planets" type="button">Planets</button>
        </li>
      </ul>
    </div>
  </nav>

  <!-- ═══ Main content ═══ -->
  <main id="main-content">

    <!-- ─── Loader ─── -->
    <div id="loader" class="loader" role="status" aria-label="Loading">
      <div class="loader__ring"></div>
      <p class="loader__text">Fetching the cosmos…</p>
    </div>

    <!-- ─── Error state ─── -->
    <div id="error-state" class="error-state hidden" role="alert">
      <span class="error-state__icon">⚠</span>
      <p id="error-message" class="error-state__text">Something went wrong.</p>
      <button id="btn-retry" class="btn btn--accent" type="button">Retry</button>
    </div>

    <!-- ═══ APOD Section (Picture of the Day) ═══ -->
    <section id="section-apod" class="section hidden" aria-label="Astronomy Picture of the Day">
      <div class="apod">
        <div class="apod__subtitle">NASA — Random Discovery</div>
        <figure class="apod__figure">
          <div class="apod__image-wrap">
            <img id="apod-image" class="apod__image" src="" alt="" />
          </div>
        </figure>

        <div class="apod__info">
          <div style="display: flex; justify-content: center; align-items: center; margin-bottom: var(--sp-lg); gap: 16px;">
            <h1 id="apod-title" class="apod__title" style="margin: 0;"></h1>
            <button id="btn-randomize" class="btn btn--accent" type="button">Discover</button>
          </div>
          
          <div class="stats-row" style="justify-content: center;">
            <div class="stat-item">
              <span class="stat-value" id="stat-date">-</span>
              <span class="stat-label">Date Captured</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-type">Image</span>
              <span class="stat-label">Format</span>
            </div>
            <div class="stat-item">
              <span class="stat-value" id="stat-copy">NASA</span>
              <span class="stat-label">Copyright</span>
            </div>
          </div>

          <p id="apod-description" class="apod__description"></p>
        </div>
      </div>
    </section>

    <!-- ═══ Category Gallery Section ═══ -->
    <section id="section-gallery" class="section hidden" aria-label="Gallery">
      <div class="gallery-header">
        <h2 id="gallery-heading" class="gallery-header__title"></h2>
        <p id="gallery-count" class="gallery-header__count"></p>
      </div>

      <div id="gallery-grid" class="gallery-grid"></div>
    </section>

    <!-- ═══ Lightbox / Detail Modal ═══ -->
    <div id="lightbox" class="lightbox hidden" role="dialog" aria-modal="true" aria-label="Image detail">
      <button id="lightbox-close" class="lightbox__close" type="button" aria-label="Close">&times;</button>
      <div class="lightbox__content">
        <img id="lightbox-image" class="lightbox__image" src="" alt="" />
        <div class="lightbox__info">
          <h3 id="lightbox-title" class="lightbox__title"></h3>
          <p id="lightbox-desc" class="lightbox__desc"></p>
        </div>
      </div>
    </div>

  </main>

  <!-- ═══ Footer ═══ -->
  <footer id="site-footer">
    <p>AstroLens &copy; 2026</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
